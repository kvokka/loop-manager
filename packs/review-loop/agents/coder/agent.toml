# The defaults of the role; a project changes them in `[agents.coder]` of its loop-manager.toml.
harness = "claude"
model = "opus"
effort = "high"
# The agents its session may call as native subagents; each has a `description` in its own agent.toml.
subagents = ["helper", "subcoder", "expert"]
# Past 300k tokens of context the coder is told to wrap up; a session stopped past 420k still goes on to the review
# (`cut = "pass"`). Each round is a session of its own. The addon is attached here and not in `[settings]`: a hook of
# the session also runs inside its subagents. A project attaches its own addons in `[agents.coder]`.
addons = [{ name = "context-budget", params = { cut = "pass" } }]
