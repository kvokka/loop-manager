# A subagent of the coder: no step of a formula names it, so it has a role prompt and no prompt template. A project
# gives it the text of its own in `[agents.expert]` (`description`, `system_prompt`).
description = "The expert of the project: the plan or the design of a critical part, a disputed design choice, a bug the coder failed to fix twice. Writes a document, changes no code."
harness = "claude"
model = "fable"
effort = "high"
