# The defaults of the role; a project changes them in `[agents.reviewer]` of its loop-manager.toml. It calls no
# subagents.
harness = "claude"
model = "opus"
effort = "high"
# The addon's default budget; each round's review is a session of its own. A project attaches its own addons in
# `[agents.reviewer]`.
addons = [{ name = "context-budget" }]
