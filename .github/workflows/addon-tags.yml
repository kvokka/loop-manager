name: addon-tags

on:
  push:
    branches: [main]
    paths: ["addons/*/addon.toml", ".github/workflows/addon-tags.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-tags

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Tags the pushed commit `addons/<name>/<version>` for each manifest version without a tag; never moves a tag.
      - name: Tag new addon versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          for manifest in addons/*/addon.toml; do
            tag=$(python3 -c 'import sys, tomllib; m = tomllib.load(open(sys.argv[1], "rb")); print("addons/%s/%s" % (m["name"], m["version"]))' "$manifest")
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null && continue
            version=${tag##*/}
            if ! grep -qx "## $version" "${manifest%/*}/CHANGELOG.md"; then
              echo "::error file=$manifest::no '## $version' heading in the changelog, $tag is not published"
              status=1
              continue
            fi
            git tag -a "$tag" -m "${tag#addons/}"
            git push origin "refs/tags/$tag"
            echo "published $tag at $GITHUB_SHA"
          done
          exit "$status"
