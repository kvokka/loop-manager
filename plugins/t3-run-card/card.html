<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T3 Code run card</title>
<style>
:root{color-scheme:light dark;font:14px/1.4 var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,CanvasText);--line:var(--color-border-secondary,GrayText);--dim:var(--color-text-secondary,GrayText);--blue:light-dark(#135eb6,#85bdff);--amber:light-dark(#805000,#f1c368);--green:light-dark(#216944,#85d7a5);--red:light-dark(#ad3434,#ff9995)}
*{box-sizing:border-box}body{margin:0;padding:8px}details{max-width:760px;margin:auto}summary{cursor:pointer;padding:4px;overflow-wrap:anywhere}strong,code,.name{font-family:var(--font-mono,ui-monospace,monospace)}#heading{margin-inline-start:4px}#position{margin-inline-start:8px;color:var(--dim)}
#graph{position:relative;margin:14px 4px 0;padding:0 0 0 10px}#steps{position:relative;list-style:none;padding:0;margin:0;width:var(--nodes,100%)}#steps:before{content:"";position:absolute;left:12px;top:20px;bottom:20px;border-left:1px solid var(--line)}
li{position:relative;display:grid;grid-template-columns:25px minmax(0,1fr) minmax(0,max-content);align-items:baseline;column-gap:8px;padding:5px 6px 5px 0;color:var(--dim)}
.symbol{position:relative;display:grid;place-content:center;align-self:start;width:25px;height:25px;border:1px solid currentColor;border-radius:50%;background:var(--color-background-primary,Canvas);line-height:1;font-family:var(--font-mono,monospace)}
[data-kind=await] .symbol > span{transform:translate(1px,1px)}
.step-label{min-width:0;line-height:25px;overflow-wrap:anywhere}.name{color:var(--color-text-primary,CanvasText)}.name:only-child,.status{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outcome{color:var(--dim);font-weight:400;white-space:pre-wrap}.status{font-size:12px;text-align:right;max-width:18ch}
[data-tone=active]{color:var(--blue)}[data-tone=waiting]{color:var(--amber)}[data-tone=passed]{color:var(--green)}[data-tone=failed]{color:var(--red)}[aria-current=step]{font-weight:650;box-shadow:inset -2px 0 currentColor;background:color-mix(in srgb,currentColor 6%,transparent);border-radius:6px}
[data-tone=skipped] .symbol{border-style:dashed}.arrival{animation:arrive .6s ease-out}@keyframes arrive{from{box-shadow:inset 0 0 0 2px currentColor}to{box-shadow:inset 0 0 0 0 transparent}}@media(prefers-reduced-motion:reduce){.arrival{animation:none}}
svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible;fill:none;stroke:var(--line);stroke-width:1.2}path.used{stroke:var(--blue);stroke-width:2}footer{margin:10px 4px;color:var(--dim);font-size:12px;overflow-wrap:anywhere}#notice{color:var(--amber)}
button,select{font:inherit;color:inherit}nav{display:flex;align-items:center;gap:.5em;margin:10px 4px}
.name:has(.session-link){white-space:normal;overflow:visible}.session-link{color:var(--blue);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:.18em;cursor:pointer}
#transcript{padding:4px}#messages{list-style:none;padding:0}#messages li{display:block;color:inherit;border-top:1px solid var(--line);padding:.65em 0}
#messages pre{margin:.35em 0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
#messages .tool pre{font-family:var(--font-mono,monospace)}[hidden]{display:none!important}
</style>
<details open><summary><strong id="heading">T3 Code run card</strong><span id="position" aria-live="polite">Connecting…</span></summary>
<nav id="rounds"><label for="round">Round</label><select id="round"></select></nav>
<section id="transcript" hidden><button type="button" id="back">Back to steps</button>
<h3 id="session-title"></h3><ol id="messages"></ol><p role="status" id="chat-status"></p>
<button type="button" id="more" hidden>Load more</button></section>
<div id="graph"><svg aria-hidden="true"></svg><ol id="steps"></ol></div>
<footer><span id="route"></span> <span id="notice" role="status"></span></footer></details>
<script>
"use strict";
const el = id => document.getElementById(id);
const svg = document.querySelector("svg");
let selectedRound = null, thread = null, timer;
let model, signature, nextId = 0, stopped = false;
const pending = new Map();

function send(method, params, id) {
  parent.postMessage({jsonrpc:"2.0", method, params, ...(id === undefined ? {} : {id})}, "*");
}
function request(method, params) {
  return new Promise((resolve, reject) => {
    const id = ++nextId;
    const timer = setTimeout(() => {pending.delete(id); reject(Error("Host did not respond"));}, 30000);
    pending.set(id, message => {
      clearTimeout(timer);
      if (message.error) reject(Error(message.error.message)); else resolve(message.result);
    });
    send(method, params, id);
  });
}
function context(ctx) {
  if (ctx?.theme === "dark" || ctx?.theme === "light") document.documentElement.style.colorScheme = ctx.theme;
}
function currentStatus(card) {
  const state = card.state;
  if (state === "running" && card.step_kind === "await") return ["waiting","Awaiting decision"];
  if (state === "parked" || state === "queued") return ["waiting",card.gate || card.waiting_for || state];
  if (state === "passed") return ["passed","Passed"];
  if (state === "failed") return ["failed","Failed"];
  if (state === "cancelled") return ["skipped","Cancelled"];
  if (state === "interrupted") return ["waiting","Interrupted"];
  return ["active",state[0].toUpperCase() + state.slice(1)];
}
function drawEdges() {
  if (!model || !document.querySelector("details").open) return;
  const graph = el("graph").getBoundingClientRect();
  const rows = [...el("steps").children];
  const paths = [];
  const links = model.plan.filter(s => s.back_to);
  links.forEach((s, i) => {
    const ends = [s.step,s.back_to].map(name => rows.find(row => row.dataset.step === name));
    if (ends.some(end => !end)) return;
    const [from,to] = ends.map(row => row.querySelector(".symbol").getBoundingClientRect());
    const x = ends[0].getBoundingClientRect().right - graph.left + 2, x2 = x + 8 + i * 5;
    const a = from.top + from.height / 2 - graph.top, b = to.top + to.height / 2 - graph.top;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M ${x} ${a} H ${x2} V ${b} H ${x} m 4 -3 l -4 3 4 3`);
    if (selectedRound === null && model.card.back_from?.includes(s.step)) path.setAttribute("class","used");
    else path.setAttribute("stroke-dasharray","3 3");
    paths.push(path);
  });
  svg.replaceChildren(...paths);
}
const kinds = {
  ai:["🧠","LLM"], exec:["›_","Script"], await:["❓","Question"],
  formula:["◇","Formula"], drain:["⑂","Task pool"]
};

function countLabel(value, limit) {
  return Number.isInteger(limit) && limit >= value ? `${value}/${limit}` : String(value);
}
function display(data) {
  model = data;
  const key = JSON.stringify([data.card,data.plan,data.roundHistory,selectedRound]);
  if (key === signature) return;
  const previous = signature !== undefined;
  signature = key;
  const c = data.card, steps = data.plan, current = steps.findIndex(s => s.step === c.step);
  const round = selectedRound ?? c.round, isCurrent = round === c.round;
  const history = data.roundHistory?.[round] ?? {};
  const select = el("round");
  if (select.options.length !== c.round) {
    select.replaceChildren(...Array.from({length:c.round}, (_,i) => new Option(String(i+1),String(i+1))));
  }
  select.value = String(round);
  const returns = steps.filter(s => s.back_to && c.back_from?.includes(s.step));
  const entries = returns.map(s => steps.findIndex(t => t.step === s.back_to)).filter(i => i >= 0);
  const start = c.round === 1 ? 0 : Math.min(...entries);
  const [tone,status] = currentStatus(c);
  el("heading").textContent = "T3 Code · " + c.formula;
  const position = [c.step, status];
  if (c.round > 1) position.unshift("Round " + countLabel(c.round, c.rounds));
  el("position").textContent = isCurrent ? position.join(" · ") : "Round " + round;
  const links = steps.filter(s => s.back_to);
  el("steps").style.setProperty("--nodes", links.length ? `calc(100% - ${18 + 5 * links.length}px)` : "100%");
  const rows = steps.map((s,i) => {
    const row = document.createElement("li");
    row.dataset.step = s.step;
    row.dataset.kind = s.kind;
    let state = ["future",data.terminal ? "Not reached" : "Ahead"];
    const recorded = history[s.step];
    if (!isCurrent) {
      state = recorded?.result === "pass" ? ["passed","Passed"] :
        recorded?.result === "fail" ? ["failed","Failed"] :
        recorded ? ["skipped","Ended"] : ["skipped","No attempt"];
    } else if (i === current) {
      state = [tone,status + (c.step_attempt > 1 ? ` · attempt ${countLabel(c.step_attempt, s.max_attempts)}` : "")];
      row.setAttribute("aria-current","step");
      if (previous) row.className = "arrival";
    } else if (i < current) {
      const result = c.results[s.step], earlier = i < start;
      state = result === "pass" ? ["passed", earlier ? "Previously passed" : "Passed"] :
        result === "fail" ? ["failed",earlier ? "Previously failed" : "Failed check"] :
        ["skipped","Skipped"];
    } else if (c.state === "passed") state = ["skipped","Skipped"];
    row.dataset.tone = state[0];
    const symbol = document.createElement("span");
    symbol.className = "symbol";
    const [glyph, type] = kinds[s.kind] || ["·", s.kind];
    const mark = document.createElement("span");
    mark.textContent = glyph;
    symbol.append(mark);
    symbol.title = type;
    symbol.setAttribute("role", "img");
    symbol.setAttribute("aria-label", type);
    const label = document.createElement("span");
    label.className = "step-label";
    const name = document.createElement("span");
    name.className = "name";
    const agent = isCurrent && i === current ? c.agent || s.agent : s.agent;
    const sessions = recorded?.sessions || [];
    name.textContent = s.title || agent || s.step;
    if (sessions.length) {
      const buttons = sessions.map((session,index) => {
        const title = session.agent || (isCurrent && i === current ? agent : null) || s.step + " (" + session.harness + ")";
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-link";
        button.textContent = title + (sessions.length > 1 ? " · session " + (index+1) : "");
        button.title = s.step + " · " + session.harness + " · attempt " + session.attempt;
        button.onclick = () => openThread(session.attempt, "Round " + round + " · " + button.textContent, button);
        return button;
      });
      name.replaceChildren();
      buttons.forEach((button,index) => { if(index) name.append(" / "); name.append(button); });
    }
    name.title = [s.step, agent, s.title].filter(Boolean).join(" · ");
    label.append(name);
    const summary = recorded?.summary ?? (isCurrent ? c.summaries?.[s.step] : null);
    if (typeof summary === "string" && summary.trim() && state[0] !== "future" && state[0] !== "skipped") {
      const outcome = document.createElement("span");
      outcome.className = "outcome";
      outcome.textContent = summary;
      label.append(" — ", outcome);
    }
    const statusLabel = document.createElement("span");
    statusLabel.className = "status";
    statusLabel.textContent = state[1];
    statusLabel.title = state[1];
    row.append(symbol, label, statusLabel);
    if (s.back_to) row.title = `On failed check: return to ${s.back_to}`;
    return row;
  });
  el("steps").replaceChildren(...rows);
  const detail = [c.id];
  if (isCurrent && returns.length) detail.push(`↶ ${returns.map(s => s.step).join(", ")} → ${steps[start]?.step || "earlier step"}`);
  if (isCurrent && c.reason && c.state !== "passed") detail.push(c.reason);
  el("route").textContent = detail.join(" · ");
  drawEdges();
}
el("round").onchange = () => {
  const value = Number(el("round").value);
  selectedRound = value === model.card.round ? null : value;
  display(model);
};
function viewThread(active) {
  el("transcript").hidden = !active;
  for (const id of ["graph","rounds","route"]) el(id).hidden = active;
}
function closeThread() {
  clearTimeout(timer);
  const previous = thread;
  thread = null;
  viewThread(false);
  selectedRound = previous.round === model.card.round ? null : previous.round;
  display(model);
  drawEdges();
  (previous?.button?.isConnected ? previous.button : el("round")).focus();
}
el("back").onclick = closeThread;
function openThread(attempt, title, button) {
  clearTimeout(timer);
  thread = {attempt, button, round:selectedRound ?? model.card.round, offset:0, busy:false, calls:new Map()};
  el("messages").replaceChildren();
  el("session-title").textContent = title;
  viewThread(true);
  el("back").focus();
  loadPage(thread);
}
function entryRow(view,entry) {
  const row = document.createElement("li"), heading = document.createElement("strong");
  const tool = entry.type === "tool_call" || entry.type === "tool_result";
  if (entry.type === "tool_call" && entry.id) view.calls.set(entry.id,entry.name);
  const role = {user:"Prompt",assistant:"Agent",tool_call:"Tool call",tool_result:entry.is_error?"Tool error":"Tool result"};
  heading.textContent = [role[entry.type],entry.name || view.calls.get(entry.id)].filter(Boolean).join(" · ");
  const body = document.createElement("pre");
  const value = tool ? (entry.type === "tool_call" ? entry.input : entry.output) : entry.text;
  body.textContent = typeof value === "string" ? value : JSON.stringify(value,null,2);
  if (tool) row.className = "tool";
  row.append(heading,body);
  return row;
}
async function loadPage(view) {
  if (!view || view.busy || stopped) return;
  view.busy = true;
  el("more").hidden = true;
  el("chat-status").textContent = "Loading session…";
  try {
    const page = unpack(await request("tools/call",{name:"read_run_thread",arguments:{
      socket:model.socket,run:model.card.id,attempt:view.attempt,offset:view.offset
    }}));
    if (thread !== view || stopped) return;
    el("messages").append(...page.entries.map(entry => entryRow(view,entry)));
    view.offset = page.next;
    el("more").hidden = !page.more;
    el("chat-status").textContent = page.more ? "" : page.live ? "Following session…" :
      view.offset ? "End of session" : "No recorded messages";
    if (!page.more && page.live) timer = setTimeout(() => loadPage(view),2000);
  } catch (error) {
    if (thread === view) {
      el("chat-status").textContent = error.message;
      el("more").hidden = false;
    }
  } finally { view.busy = false; }
}
el("more").onclick = () => loadPage(thread);
function unpack(reply) {
  if (reply.isError || !reply.structuredContent) throw Error(reply.content?.[0]?.text || "Missing card data");
  return reply.structuredContent;
}
async function follow(first) {
  display(first);
  let cursor = first.cursor;
  while (!stopped && !model.terminal) {
    try {
      const args = {run:first.card.id, cursor};
      if (first.socket) args.socket = first.socket;
      const update = unpack(await request("tools/call",{name:"watch_run_card",arguments:args}));
      if (stopped) return;
      cursor = update.cursor;
      if (update.card) display(update);
      el("notice").textContent = "";
    } catch (error) {
      el("notice").textContent = `Reconnecting · ${error.message}`;
      await new Promise(resolve => setTimeout(resolve,2500));
    }
  }
}
addEventListener("message",event => {
  const m = event.data;
  if (event.source !== parent || m?.jsonrpc !== "2.0") return;
  if (m.method === "ui/notifications/tool-result" && !model) {
    try { follow(unpack(m.params)).catch(error => el("notice").textContent = error.message); }
    catch (error) {el("position").textContent = "Unavailable"; el("notice").textContent = error.message;}
  } else if (m.method === "ui/notifications/host-context-changed") context(m.params);
  else if (m.method === "ui/resource-teardown") {
    stopped = true; clearTimeout(timer);
    parent.postMessage({jsonrpc:"2.0",id:m.id,result:{}}, "*");
  } else if (pending.has(m.id)) {
    const resolve = pending.get(m.id); pending.delete(m.id); resolve(m);
  }
});
new ResizeObserver(() => {
  drawEdges();
  send("ui/notifications/size-changed",{height:Math.ceil(document.body.getBoundingClientRect().height)});
}).observe(document.body);
request("ui/initialize",{appInfo:{name:"t3-run-card",version:"0.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"})
  .then(result => {context(result.hostContext);send("ui/notifications/initialized",{});})
  .catch(error => el("notice").textContent = error.message);
</script></html>
