name = "conventional-commits"
version = "0.4.0"
prompt = "prompt.md"

[agent.env]
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "include.path"
GIT_CONFIG_VALUE_0 = "${LOOP_MANAGER_ADDON_DIR}/gitconfig"

[[hook]]
on = "run.preparing"
command = ["hooks/prepare"]

[dependencies.git]
minimum = "2.55.0"
command = ["git", "--version"]
pattern = '(?m)^git version (\S+)'
scope = "both"

[dependencies.jq]
minimum = "1.8.2"
command = ["jq", "--version"]
pattern = '(?m)^jq-(\S+)'
scope = "daemon"
