name = "agent-mail"
version = "0.6.0"
harnesses = ["claude", "codex"]
prompt = "prompt.md"

[params]
# Empty selects an ephemeral loopback port.
bind = ""
# Shared service option: enable Agent Mail product operations across linked repositories.
multi_repo = false
# The mail project of the rig; empty: the canonical path of the rig's repository (its own path outside Git).
project_key = ""
# Seconds a reservation lasts unless renewed.
ttl = 3600
# The thread of the runs; empty: one per chain of runs (the project and the run's correlation).
thread = ""

[agent.env]
LOOP_MANAGER_AGENT_MAIL_DATA = "${LOOP_MANAGER_ADDON_DATA}"

[agent.hooks.agent-mail-start]
event = "SessionStart"
command = "'${LOOP_MANAGER_ADDON_DIR}/bin/lm-agent-mail' session-start"
timeout = "30s"

[[hook]]
on = "run.preparing"
command = ["bin/lm-agent-mail", "prepare"]

[[hook]]
on = "run.passed"
command = ["bin/lm-agent-mail", "release"]

[[hook]]
on = "run.failed"
command = ["bin/lm-agent-mail", "release"]

[[hook]]
on = "run.cancelled"
command = ["bin/lm-agent-mail", "release"]

# One server for every session of the daemon: nothing of a run, rig or project goes here, or the daemon would start
# one per value (docs/design/config.md, "MCP servers and services").
[[service]]
name = "agent-mail"
scope = "orchestrator"
bind = "${params.bind}"
command = [
  "${LOOP_MANAGER_ADDON_DIR}/bin/lm-agent-mail",
  "serve",
  "${LOOP_MANAGER_ADDON_DATA}",
  "${params.multi_repo}",
]
health = { http = "/health/readiness" }
mcp = { url = "/mcp/" }

[dependencies.git]
minimum = "2.55.0"
command = ["git", "--version"]
pattern = '(?m)^git version (\S+)'
scope = "both"

[dependencies.jq]
minimum = "1.8.2"
command = ["jq", "--version"]
pattern = '(?m)^jq-(\S+)'
scope = "both"

[dependencies.curl]
minimum = "8.18.0"
command = ["curl", "--version"]
pattern = '(?m)^curl (\S+)'
scope = "both"

[dependencies.python3]
minimum = "3.14.0"
command = ["python3", "--version"]
pattern = '(?m)^Python (\S+)'
scope = "daemon"

[dependencies.mcp-agent-mail]
minimum = "0.3.41"
command = ["mcp-agent-mail", "--version"]
pattern = '(?m)^mcp-agent-mail (\S+)'
scope = "daemon"
