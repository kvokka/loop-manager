name = "t3-notify"
version = "0.3.0"

[params]
spend = "agent" # the spend table of a run's last notice: "off", "total", "agent" or "model" (README.md)

# One hook for the five moments of a run its T3 Code thread is told about (README.md).
[[hook]]
on = "run.started"
command = ["hooks/notify"]

[[hook]]
on = "run.awaiting"
command = ["hooks/notify"]

[[hook]]
on = "run.passed"
command = ["hooks/notify"]

[[hook]]
on = "run.failed"
command = ["hooks/notify"]

[[hook]]
on = "run.cancelled"
command = ["hooks/notify"]

[dependencies.t3]
minimum = "0.1.11"
command = ["t3", "--version"]
pattern = '(?m)^t3 v(\S+)'
scope = "daemon"

[dependencies.python3]
minimum = "3.14.0"
command = ["python3", "--version"]
pattern = '(?m)^Python (\S+)'
scope = "daemon"
