# OpenAI: the GPT models. `service_tier` is the value of the request parameter (`flex`, `fast`, `ultrafast`;
# the API also takes `priority` for `fast` and reports `priority` for GPT-5.6 and earlier). `cache_write` is the
# 30-minute write. A long-context rate applies over 272K input tokens.

# The 12-hour cache write is 20 (40 over the context threshold).
[[pricing]]
model = "gpt-6.2-astra"
input = 8
cache_read = 0.4
cache_write = 10
output = 40
long_context_over = 272000
long_context = { input = 16, cache_read = 0.8, cache_write = 20, output = 60 }

# The 12-hour cache write is 40 (80 over the context threshold).
[[pricing]]
model = "gpt-6.2-astra"
service_tier = "fast"
input = 16
cache_read = 0.8
cache_write = 20
output = 80
long_context_over = 272000
long_context = { input = 32, cache_read = 1.6, cache_write = 40, output = 120 }

