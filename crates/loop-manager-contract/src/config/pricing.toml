# The official API prices loop-manager prices a request by when the harness reports no cost and the user has no
# `[[pricing]]` entry for it (docs/design/formula-budgets.md). Rates are USD per 1M tokens.
# Verify every price on the two pages when publishing a new catalog, and change `date`.
date = "2026-11-25"
sources = ["https://developers.openai.com/api/docs/pricing", "https://platform.claude.com/docs/en/about-claude/pricing"]

# Anthropic: the Claude API. `cache_write` is the 5-minute write, `cache_write_1h` the 1-hour one. Claude Haiku 5.5
# counts all input tokens, read and written from the cache too, against its 100,000-token threshold.

