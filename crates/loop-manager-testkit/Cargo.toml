[package]
name = "loop-manager-testkit"
description = "Test doubles of loop-manager: the scripted driver and fake providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mcp-probe"
path = "src/bin/mcp-probe.rs"
# With `test = false` a `#[test]` here is silently never run: whoever adds one removes this key first.
test = false

[[bin]]
name = "acp-agent"
path = "src/bin/acp-agent.rs"
# With `test = false` a `#[test]` here is silently never run: whoever adds one removes this key first.
test = false

[lints]
workspace = true

[dependencies]
loop-manager-contract = { version = "0.0.1", path = "../loop-manager-contract" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "net", "macros", "process"] }
tokio-stream = "0.1.19"
agent-client-protocol = { version = "=5.5.1", features = ["unstable_protocol_v2", "stdio"] }
rustix = { version = "1.1.6", features = ["process"] }

[dev-dependencies]
loop-manager-core = { version = "0.0.1", path = "../loop-manager-core" }
loop-manager-addons = { version = "0.0.1", path = "../loop-manager-addons" }
rusqlite = "0.42.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util", "io-util", "net"] }
