[package]
name = "loop-manager"
description = "An event-driven orchestrator for coding agents and the loops they work in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
loop-manager-br = { version = "0.0.1", path = "../loop-manager-br" }
loop-manager-acp = { version = "0.0.1", path = "../loop-manager-acp" }
loop-manager-core = { version = "0.0.1", path = "../loop-manager-core" }
loop-manager-front = { version = "0.0.1", path = "../loop-manager-front" }
loop-manager-addons = { version = "0.0.1", path = "../loop-manager-addons" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = "4.6.7"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros", "process", "io-util", "sync", "time"] }
toml = "1.2.1"
agent-client-protocol = { version = "=5.5.1", features = ["unstable_protocol_v2", "stdio"] }
base64 = "0.23.1"

[dev-dependencies]
futures = "0.3.34"
loop-manager-testkit = { version = "0.0.1", path = "../loop-manager-testkit" }
rusqlite = "0.42.0"
tempfile = "3.27.0"
