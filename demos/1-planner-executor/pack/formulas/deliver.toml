name = "deliver"
description = "A request becomes beads per rig, coders do them, and the report says what got done"

[inputs]
task = { type = "task", required = true }   # the request: its text becomes the root bead

[[step]]
name = "plan"
kind = "ai"
agent = "planner"
timeout = "20m"

[[step]]
name = "work"
kind = "drain"
formula = "implement"                       # a run per bead under the root, on the rig of the prefix of its id
pool = 2                                    # two beads in work at once

# The beads under the root as they are, and whether all of them are closed.
[[step]]
name = "report"
kind = "exec"
command = ["sh", "-c", '''
set -eu
project=$(loop-manager --json run show "$LOOP_MANAGER_RUN" | jq -r .project)
beads=$(loop-manager --json bead list --project "$project" "$LOOP_MANAGER_BEAD")
printf '%s' "$beads" | jq -r '.[] | "\(.id): \(.title) [\(.status)]"'
echo "drain: $LOOP_MANAGER_STEP_WORK_DATA"
printf '%s' "$beads" | jq -e 'length > 0 and all(.status == "closed")' >/dev/null
''']
