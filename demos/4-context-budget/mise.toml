# What the demo needs besides loop-manager; mise is a convenience, any install of these tools does.
[tools]
node = "26.12.0"                      # what the ACP adapters run on
"npm:@agentclientprotocol/claude-agent-acp" = "0.109.1" # the `claude` harness; `claude-agent-acp --cli` logs in
"npm:@agentclientprotocol/codex-acp" = "2.9.0"          # the `codex` harness
codex = "0"                           # `codex login`
"github:Dicklesworthstone/beads_rust" = "0.7.6"
jq = "1.8.2"

[tasks.check]
description = "The pack, the project and the addon load"
run = "loop-manager config check --config root/config.toml"

[tasks.demo]
description = "The demo from the requests to its report; EXAMPLE=1 keeps the result as the *-example"
run = "./run.sh"
