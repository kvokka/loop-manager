name = "cleanup"
description = "Clears what a cancelled feature left: its open pull requests, its branches and its issues"

[inputs]
issue = { type = "string", required = true }   # the issue of the cancelled feature, which nothing holds any more

[[step]]
name = "cleanup"
kind = "exec"
command = ["sh", "-c", '''
set -eu
branch="feature/$LOOP_MANAGER_INPUT_ISSUE"
project=$(loop-manager --json run show "$LOOP_MANAGER_RUN" | jq -r .project)
places=$(loop-manager --json project list --project "$project")
for repo in $(printf '%s' "$places" | jq -r '.[0] | .rigs[].path, .root.path'); do
  cd "$repo"
  state=$(gh pr view "$branch" --json state -q .state 2>/dev/null) || state=none
  [ "$state" != OPEN ] || gh pr close "$branch"
  ! git ls-remote -q --exit-code --heads origin "$branch" >/dev/null || git push -q origin --delete "$branch"
  base=$(git rev-parse --abbrev-ref origin/HEAD); base=${base#origin/}
  git switch -q -f "$base"
  git reset -q --hard "origin/$base"    # a feature cancelled before `pr` left its commits here
  ! git show-ref -q --verify "refs/heads/$branch" || git branch -q -D "$branch"
done
# The issues under it close first, the newest first: a parent with an open child is not closed. A closed one stays so.
for issue in $(loop-manager --json issue list --project "$project" "$LOOP_MANAGER_INPUT_ISSUE" |
  jq -r 'reverse | .[] | select(.status != "closed") | .id') "$LOOP_MANAGER_INPUT_ISSUE"; do
  loop-manager issue close --project "$project" --reason "the feature was cancelled" "$issue" >/dev/null
done
echo "cleanup: $LOOP_MANAGER_INPUT_ISSUE"
''']
