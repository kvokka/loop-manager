# What the demo needs besides loop-manager; mise is a convenience, any install of these tools does.
[tools]
node = "26.12.0"                      # what the ACP adapter runs on
"npm:@agentclientprotocol/codex-acp" = "2.9.0"          # the `codex` harness
codex = "0"                           # `codex login`
gh = "2.103.2"                        # the pull requests, and the reviewer's only way to act
"github:Dicklesworthstone/beads_rust" = "0.7.6"
jq = "1.8.2"

[tasks.check]
description = "The pack and the project load"
run = "loop-manager config check --config root/config.toml"

[tasks.demo]
description = "The demo from the request to its report; EXAMPLE=1 keeps the result as the *-example"
run = "./run.sh"
